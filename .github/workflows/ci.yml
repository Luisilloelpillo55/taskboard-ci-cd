name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        id: python-deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Install Node dependencies
        id: node-deps
        run: npm ci

      - name: Install Playwright browser
        id: playwright-browser
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        run: >-
          .venv/bin/python -m pytest -q
          --junitxml=api-test-results.xml
          -o junit_logging=all
          --html=api-test-report.html
          --self-contained-html
          --cov=app
          --cov-report=term-missing
          --cov-report=html:backend-coverage

      - name: Test Playwright event reporter
        if: always() && steps.node-deps.outcome == 'success'
        run: node --test scripts/report-playwright-events.test.js

      - name: Run isolated API load test
        if: always() && steps.python-deps.outcome == 'success'
        run: .venv/bin/python scripts/load_test_api.py --concurrency 20 --requests-per-worker 50

      - name: Run Playwright API and browser tests
        if: >-
          always() &&
          steps.node-deps.outcome == 'success' &&
          steps.playwright-browser.outcome == 'success'
        run: npm run test:e2e

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: api-test-report.html
          if-no-files-found: warn
          retention-days: 7

      - name: Upload API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-diagnostics
          path: |
            api-test-results.xml
            api-load-test.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-results
          path: test-results/playwright-results.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Build and publish Docker image
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tested image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/luisilloelpillo55/taskboard-ci-cd:sha-${{ github.sha }}
            ghcr.io/luisilloelpillo55/taskboard-ci-cd:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Luisilloelpillo55/taskboard-ci-cd
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy EC2 via SSM
    needs: [test, publish]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.GHCR_IMAGE_PUBLIC == 'true' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Validate deployment target
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "Set the EC2_INSTANCE_ID repository variable to the target instance ID." >&2
            exit 1
          fi
          if [[ ! "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "Set AWS_DEPLOY_ROLE_ARN to the GitHub OIDC deployment role ARN." >&2
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TaskboardDeploy-${{ github.run_id }}

      - name: Deploy through Systems Manager
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          parameters="{\"commands\":[\"set -eu\",\"sudo -u taskboard git -C /opt/taskboard pull --ff-only\",\"sudo env TASKBOARD_IMAGE=ghcr.io/luisilloelpillo55/taskboard-ci-cd:sha-${DEPLOY_COMMIT} bash /opt/taskboard/scripts/deploy-ec2.sh\",\"sudo docker compose --project-directory /opt/taskboard -f /opt/taskboard/deploy/compose.yaml ps taskboard\",\"sudo systemctl is-active taskboard-hostmetrics\",\"curl --fail --silent --show-error http://127.0.0.1:8000/api/health\"]}"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Taskboard deployment ${DEPLOY_COMMIT}" \
            --timeout-seconds 900 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          status=""
          for attempt in $(seq 1 120); do
            status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for the SSM deployment command (${command_id})." >&2
          exit 1

  report-ci:
    name: Send CI result to OpenObserve
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Playwright JSON results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-json-results
          path: playwright-json-results

      - name: Download API diagnostics
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: api-diagnostics
          path: api-diagnostics

      - name: Set up Python for test-event reporting
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test result event
        if: >-
          always() &&
          env.OPENOBSERVE_URL != '' &&
          env.OPENOBSERVE_ORG != '' &&
          env.OPENOBSERVE_STREAM != '' &&
          env.OPENOBSERVE_AUTHORIZATION != ''
        env:
          OPENOBSERVE_URL: ${{ vars.OPENOBSERVE_URL }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM }}
          OPENOBSERVE_AUTHORIZATION: ${{ secrets.OPENOBSERVE_AUTHORIZATION }}
          CI_EVENT_TYPE: ci_tests
          CI_RESULT: ${{ needs.test.result }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_ACTOR: ${{ github.actor }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/report-ci-event.sh

      - name: Send Playwright case events to OpenObserve
        if: >-
          always() &&
          env.OPENOBSERVE_URL != '' &&
          env.OPENOBSERVE_ORG != '' &&
          env.OPENOBSERVE_STREAM != '' &&
          env.OPENOBSERVE_AUTHORIZATION != ''
        env:
          OPENOBSERVE_URL: ${{ vars.OPENOBSERVE_URL }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM }}
          OPENOBSERVE_AUTHORIZATION: ${{ secrets.OPENOBSERVE_AUTHORIZATION }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_ACTOR: ${{ github.actor }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-playwright-events.js playwright-json-results/playwright-results.json

      - name: Send backend and load-test events to OpenObserve
        if: >-
          always() &&
          env.OPENOBSERVE_URL != '' &&
          env.OPENOBSERVE_ORG != '' &&
          env.OPENOBSERVE_STREAM != '' &&
          env.OPENOBSERVE_AUTHORIZATION != ''
        env:
          OPENOBSERVE_URL: ${{ vars.OPENOBSERVE_URL }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM }}
          OPENOBSERVE_AUTHORIZATION: ${{ secrets.OPENOBSERVE_AUTHORIZATION }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_ACTOR: ${{ github.actor }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/report_test_events.py
          --junit api-diagnostics/api-test-results.xml
          --load api-diagnostics/api-load-test.json

  report-deploy:
    name: Send deployment result to OpenObserve
    needs: [test, publish, deploy]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send deployment result event
        if: >-
          env.OPENOBSERVE_URL != '' &&
          env.OPENOBSERVE_ORG != '' &&
          env.OPENOBSERVE_STREAM != '' &&
          env.OPENOBSERVE_AUTHORIZATION != ''
        env:
          OPENOBSERVE_URL: ${{ vars.OPENOBSERVE_URL }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM }}
          OPENOBSERVE_AUTHORIZATION: ${{ secrets.OPENOBSERVE_AUTHORIZATION }}
          CI_EVENT_TYPE: deployment
          CI_RESULT: ${{ needs.deploy.result }}
          CI_TEST_RESULT: ${{ needs.test.result }}
          CI_IMAGE_RESULT: ${{ needs.publish.result }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_ACTOR: ${{ github.actor }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/report-ci-event.sh
